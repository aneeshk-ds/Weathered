name: Android Direct APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-direct-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build APK on GitHub runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Project release checks
        run: npm run verify:project

      - name: Typecheck
        run: npm run typecheck

      - name: Core smoke tests
        run: npm run test:core

      - name: Data stress tests
        run: npm run test:data

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease --no-daemon

      - name: Publish latest APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk weathered-latest.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk weathered-latest.apk \
            --title "Weathered latest Android APK" \
            --notes "Direct GitHub runner APK built from ${{ github.sha }}." \
            --latest
